<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="style.css">
    <title>NexusTitan</title>
</head>
<body>
    <header>
        <img src="imagens-inicio/logo-icone/logo-header.png" alt="Logo NexusTitan">

        <div class="container-texto-logo">
            <h1>
                NEXUS <br>
                <span>TITAN</span>
            </h1>
        </div>
        
        <nav class="menu">
            <a href="">INÍCIO</a>
            <a href="">MODALIDADES</a>
            <a href="">ESTRUTURA</a>

        <nav class="matricula">

        <div class="conteudo-principal">
            
        </div>

    <main>
        <section class="conteudo">

            <!-- === CONTEÚDO ESCRITO === -->
            <div class="conteudo-inicial">

                    DISCIPLINA • FOCO • EVOLUÇÃO
                </p>

                    SUPERE<br>

                    Mais que uma academia.<br> Um espaço para você <span>evoluir</span> e se tornar sua <span>melhor versão</span>.

                    <a href="">COMEÇAR AGORA</a>
                    <a href="">CONHEÇA A ACADEMIA</a>
                </div>
            </div>

            <!-- === CONTEÚDO VISUAL === -->
            <div class="conteudo-visual">
                <img src="imagens-inicio/banner-principal/amarelo-tinta.png" class="forma-amarela" alt="">

                <img src="imagens-inicio/banner-principal/roxo-tinta.png" class="forma-roxa" alt="">

                <img src="imagens-inicio/banner-principal/mulher.png" class="mulher" alt="">

    <footer></footer>
