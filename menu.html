<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Titan Academia</title>
  <link rel="stylesheet" href="menu.css">
  <!-- Fontes Oficiais da Marca (Orbitron + Rajdhani) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar-wrapper">
    <nav class="navbar">
      
      <!-- LOGO OFICIAL + TEXTO DA MARCA -->
      <div class="brand-container">
        <img src="imagem/LOGO 2.png" alt="Nexus Titan Logo" class="brand-logo-img">
        
        <div class="brand-text">
          <div class="brand-title">
            <span class="text-nexus">NEXUS</span>

          <span class="text-academia">ACADEMIA</span>
        </div>

        <div class="diagonal-divider"></div>
      </div>

      <!-- TÓPICOS DO MENU -->
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="#inicio">
            <i data-lucide="home"></i>
            <span>INÍCIO</span>
            <div class="hover-line"></div>
          </a>
        </li>
        <li class="nav-item">
          <a href="modalidades.html">
            <i data-lucide="shield-check"></i>
            <span>MODALIDADES</span>
            <div class="hover-line"></div>
          </a>
        </li>
        <li class="nav-item">
          <a href="estrutura.html">
            <!-- Ícone Haltere Horizontal Personalizado -->
            <svg class="custom-dumbbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12h20"/>
              <path d="M5 8v8"/>
              <path d="M7 6v12"/>
              <path d="M17 6v12"/>
              <path d="M19 8v8"/>
            </svg>
            <span>ESTRUTURA</span>
            <div class="hover-line"></div>
          </a>
        </li>
        <li class="nav-item">
          <a href="#profissionais">
            <i data-lucide="users"></i>
            <span>PROFISSIONAIS</span>
            <div class="hover-line"></div>
          </a>
        </li>
        <li class="nav-item">
          <a href="sobre.html">
            <i data-lucide="info"></i>
            <span>SOBRE</span>
            <div class="hover-line"></div>
          </a>
        </li>
      </ul>

      <!-- BOTÃO FAÇA SUA MATRÍCULA -->
      <a href="matricula.html" class="btn-cta">
        <span>FAÇA SUA MATRÍCULA</span>
        <i data-lucide="arrow-right"></i>
      </a>

  <script src="script.js"></script>
